# NES Controller Keybinds
# Edit key names to customize. Use SDL key names.
# Common keys: Z, X, Backslash, Return, Up, Down, Left, Right
# Tab and F1-F12 are reserved runtime hotkeys.

[player1]
a = Z
b = X
select = \
start = Return
up = Up
down = Down
left = Left
right = Right

[camera]
# Optional Voxel/3D camera keys. Gamepad look defaults to the right stick.
look_up = Keypad 8
look_down = Keypad 2
look_left = Keypad 4
look_right = Keypad 6
roll_left = Keypad 7
roll_right = Keypad 9
zoom_in = Keypad +
zoom_out = Keypad -
sprite_smaller = Keypad 1
sprite_larger = Keypad 3
reset = Keypad 5
toggle = Keypad 0

[zapper]
# Mouse as the Zapper light gun (default on for Zapper games):
# left click = trigger, mouse position = aim.  Set false to disable.
mouse = true
# Show a crosshair at the aim point (and hide the OS cursor).
crosshair = true

# Gamepad bindings (SDL game-controller button names).
# Values may list multiple buttons separated by commas, e.g. "a, b".
# Valid names: a b x y back start guide leftshoulder rightshoulder
#   leftstick rightstick dpup dpdown dpleft dpright (use "none" to unbind).
# deadzone: left-stick threshold 0-32767.  analog: stick also moves the d-pad.
# Names are positional (a=bottom, b=right, x=left, y=top on an Xbox pad).

[gamepad1]
a = a,b
b = x,y
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
deadzone = 16000
analog = true

[gamepad2]
a = a,b
b = x,y
select = back
start = start
up = dpup
down = dpdown
left = dpleft
right = dpright
deadzone = 16000
analog = true

